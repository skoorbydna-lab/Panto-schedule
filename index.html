function mondays(startISO, endISO) {
  const out = []; let d = new Date(startISO + 'T12:00:00Z'); const end = new Date(endISO + 'T12:00:00Z');
  while (d < end) { out.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() + 7 * 864e5); }
  return out;
}
// Thursday availability for the starting schedule: only these can make Thursdays
const THURSDAY_AWAY = ['Beth', 'Mary'];
const PHIL_B_THURSDAYS_FROM = '2026-12-12';
// Known one-off absences
const DATE_AWAY = { '2026-12-03': ['Mel'], '2026-12-10': ['Ro'], '2026-12-14': ['Mel'], '2027-01-07': ['Mel', 'Ro'] };
const BB = 'Brass Button', BR = 'The Bridge', HU = 'Hulland';
const DEFAULT_NIGHTS = [
  ['2026-11-23', BB, 'rehearsal', '7.30pm', '', 'AGM first', ['a1s1', 'a1s3']],
  ['2026-11-26', BR, 'rehearsal', '7.30pm', '', 'Committee meeting first'],
  ['2026-11-30', BB], ['2026-12-03', BR], ['2026-12-07', BB], ['2026-12-10', BR],
  ['2026-12-14', BB], ['2026-12-17', BR],
  ['2027-01-04', BB], ['2027-01-07', BR], ['2027-01-11', BB], ['2027-01-14', BR],
  ['2027-01-18', BB, 'run', '7.30pm', 'Full run'], ['2027-01-21', BB],
  ['2027-01-24', HU, 'event', '10am–2pm', 'Set up'],
  ['2027-01-25', HU, 'event', '6–10pm', 'Tech / bits'],
  ['2027-01-26', HU, 'run', '6–10pm', 'Tech / full run'],
  ['2027-01-27', '', 'cancelled', '', 'Night off!'],
  ['2027-01-28', HU, 'run', '', 'Dress run'],
  ['2027-01-29', HU, 'event', '7pm', 'First performance'],
  ['2027-01-30', HU, 'event', '2.30pm & 7pm', 'Two shows'],
  ['2027-01-31', HU, 'event', '11am–1pm', 'Break the set']
];
const SCHEMA_V = 7;   // bump to replace the live schedule with new starting dates
function defaultState() {
  return {
    v: SCHEMA_V,
    settings: { sessionMins: 120, startTime: '19:30', minReps: 2, opening: '2027-01-29' },
    cast: DEFAULT_CAST.map(c => ({ ...c })),
    scenes: DEFAULT_SCENES.map(s => ({ ...s, roles: [...s.roles] })),
    nights: DEFAULT_NIGHTS.map(([date, venue, type = 'rehearsal', time = '7.30pm', label = '', note = '', scenes]) => {
      const thu = new Date(date + 'T12:00:00Z').getUTCDay() === 4 && type === 'rehearsal';
      return { date, venue, type, time, label, note, away: [...new Set([...(thu ? THURSDAY_AWAY : []), ...(thu && date < PHIL_B_THURSDAYS_FROM ? ['Phil B'] : []), ...(DATE_AWAY[date] || [])])], scenes: scenes ? [...scenes] : [], locked: !!scenes };
    })
  };
}
function actorsFor(state, scene) {
  const map = Object.fromEntries(state.cast.map(c => [c.role, c.actor.trim()]));
  const set = new Set();
  scene.roles.forEach(r => { if (map[r]) set.add(map[r]); });
  return [...set];
}
function allActors(state) { return [...new Set(state.cast.map(c => c.actor.trim()).filter(Boolean))]; }

// Seeded RNG so a re-plan is repeatable
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// Plan: keeps locked nights, fills every other rehearsal night.
function plan(state, opts = {}) {
  const S = state.scenes, N = state.nights, cap = state.settings.sessionMins, R = state.settings.minReps;
  const sceneActors = S.map(s => actorsFor(state, s));
  const sceneIdx = Object.fromEntries(S.map((s, i) => [s.id, i]));
  const free = []; // night indexes the planner may fill
  N.forEach((n, i) => { if (n.type === 'rehearsal' && !n.locked) free.push(i); });
  const fixed = N.map((n, i) => (n.type === 'rehearsal' && n.locked) ? n.scenes.filter(id => id in sceneIdx).map(id => sceneIdx[id]) : []);
  const away = N.map(n => new Set(n.away));
  const capOf = ni => N[ni].mins || cap;
  const miss = (si, ni) => sceneActors[si].filter(a => away[ni].has(a)).length;
  const usable = (si, ni) => { const m = miss(si, ni); return m <= 2 && sceneActors[si].length - m >= 2 && m < sceneActors[si].length - m; };
  const fixedCount = S.map((_, si) => fixed.reduce((a, l) => a + l.filter(x => x === si).length, 0));
  const fixedFull = S.map((_, si) => fixed.reduce((a, l, ni) => a + l.filter(x => x === si && miss(si, ni) === 0).length, 0));
  if (!free.length) return { nights: N.map(n => n.scenes.slice()), cost: 0 };
  const W = { over: 5000, dup: 5000, short: 3000, unusable: 2000, missing: 40, called: 2, gap: 15, early: 0.3, inv: 10, spread: 60 };

  function anneal(slots) {
    let hard = 0;
    function cost(assign) {
      hard = 0;
      const per = N.map((_, i) => fixed[i].slice());
      assign.forEach((ni, k) => per[ni].push(slots[k]));
      let c = 0;
      const occ = S.map(() => []), full = fixedFull.slice();
      per.forEach((list, ni) => {
        if (N[ni].type !== 'rehearsal' || !list.length) return;
        const seen = new Set(); let mins = 0; const called = new Set();
        list.forEach(si => {
          if (seen.has(si)) { c += W.dup; hard++; } seen.add(si);
          mins += S[si].mins; occ[si].push(ni);
          const m = miss(si, ni);
          if (!N[ni].locked) { if (m === 0) full[si]++; else if (!usable(si, ni)) { c += W.unusable; hard++; } }
          c += W.missing * m;
          sceneActors[si].forEach(a => called.add(a));
        });
        if (mins > capOf(ni)) { c += W.over * (mins - capOf(ni)); hard++; }
        c += W.called * called.size;
      });
      full.forEach(f => { if (f < R) { c += W.short * (R - f); hard++; } });
      const first = occ.map(l => l.length ? Math.min(...l) : 99);
      for (let i = 0; i < first.length; i++) for (let j = i + 1; j < first.length; j++) if (first[j] < first[i]) c += W.inv;
      occ.forEach(list => {
        list.sort((a, b) => a - b);
        if (list.length) c += W.early * list[0];
        for (let j = 1; j < list.length; j++) { const g = list[j] - list[j - 1]; if (g < 3) c += W.gap * (3 - g); }
      });
      return c;
    }
    let best = null, bestC = Infinity, bestHard = 0;
    const restarts = opts.restarts || 4, iters = opts.iters || 20000;
    for (let r = 0; r < restarts; r++) {
      const rand = rng(1234 + r * 7919);
      let cur = slots.map(() => free[Math.floor(rand() * free.length)]);
      let cc = cost(cur), T = 60;
      for (let it = 0; it < iters; it++) {
        const next = cur.slice();
        if (rand() < 0.7) next[Math.floor(rand() * next.length)] = free[Math.floor(rand() * free.length)];
        else { const a = Math.floor(rand() * next.length), b = Math.floor(rand() * next.length); [next[a], next[b]] = [next[b], next[a]]; }
        const nc = cost(next);
        if (nc <= cc || rand() < Math.exp((cc - nc) / T)) { cur = next; cc = nc; }
        T = Math.max(0.05, T * 0.9995);
        if (cc < bestC) { bestC = cc; best = cur.slice(); cost(best); bestHard = hard; }
      }
    }
    return { best, bestC, hard: bestHard };
  }

  // Try the highest even number of rehearsals per scene that fits, then step down.
  const capacity = free.reduce((a, ni) => a + capOf(ni), 0);
  const needFor = T => S.reduce((a, s, si) => a + s.mins * Math.max(0, T - fixedCount[si]), 0);
  let T = R; while (needFor(T + 1) <= capacity * 0.9) T++;
  let chosen = null;
  for (; T >= R; T--) {
    const slots = []; S.forEach((s, si) => { for (let k = fixedCount[si]; k < T; k++) slots.push(si); });
    const res = anneal(slots); res.slots = slots;
    chosen = res;
    if (res.hard === 0) break;   // no overruns, no double-booking, enough full-cast rehearsals
  }
  const result = N.map((n, i) => (n.type === 'rehearsal' && n.locked) ? n.scenes.slice() : []);
  chosen.best.forEach((ni, k) => result[ni].push(S[chosen.slots[k]].id));
  // Top up spare time with the least-rehearsed scenes that can be done that night.
  const reps = Object.fromEntries(S.map(sc => [sc.id, 0]));
  result.forEach(l => l.forEach(id => reps[id]++));
  const used = ni => result[ni].reduce((t, id) => t + S[sceneIdx[id]].mins, 0);
  while (true) {
    let best = null;
    free.forEach(ni => {
      const spare = capOf(ni) - used(ni);
      S.forEach((sc, si) => {
        if (result[ni].includes(sc.id) || reps[sc.id] > T + 1 || sc.mins > spare || !usable(si, ni)) return;
        const near = result.some((l, k) => l.includes(sc.id) && Math.abs(k - ni) < 2) ? 1 : 0;
        const key = [reps[sc.id], near, miss(si, ni), -spare];
        if (!best || key.some((v, x) => v !== best.key[x]) && key.find((v, x) => v !== best.key[x]) < best.key[key.findIndex((v, x) => v !== best.key[x])]) best = { ni, sc, key };
      });
    });
    if (!best) break;
    result[best.ni].push(best.sc.id); reps[best.sc.id]++;
  }
  result.forEach(list => list.sort((a, b) => sceneIdx[a] - sceneIdx[b]));
  return { nights: result, cost: chosen.bestC, perScene: T };
}

    document.body.appendChild(m);
    m.querySelector('#x-no').onclick = () => m.remove();
    m.querySelector('#x-ok').onclick = () => { m.remove(); state = defaultState(); replan(); };
  }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'me-sel') { me = el.value; if (!me) onlyMine = false; saveMe(); render(); return; }
  if (el.id === 'me-only') { onlyMine = el.checked; saveMe(); render(); return; }
  if (!canEdit) return;
  if (d.type) { const n = state.nights[+d.type]; n.type = el.value; if (n.type!=='rehearsal') n.scenes = []; save(); render(); toast('Re-plan to rebalance the other nights'); }
  else if (d.add) { if (el.value) { const n = state.nights[+d.add]; n.scenes.push(el.value); const order = state.scenes.map(s=>s.id); n.scenes.sort((a,b)=>order.indexOf(a)-order.indexOf(b)); n.locked = true; save(); render(); } }
  else if (d.venue !== undefined) { state.nights[+d.venue].venue = el.value.trim(); save(); render(); }
  else if (d.time !== undefined) { state.nights[+d.time].time = el.value.trim(); save(); render(); }
  else if (d.label !== undefined) { state.nights[+d.label].label = el.value.trim(); save(); render(); }
  else if (d.note !== undefined) { state.nights[+d.note].note = el.value; save(); render(); }
  else if (d.mins) { state.scenes[+d.mins].mins = Math.max(5, +el.value||5); save(); render(); }
  else if (d.cast) { state.cast[+d.cast].actor = el.value; save(); }
  else if (el.id === 's-start') { state.settings.startTime = el.value || '19:30'; save(); }
  else if (el.id === 's-len') { state.settings.sessionMins = Math.max(30, +el.value||120); save(); }
  else if (el.id === 's-reps') { state.settings.minReps = +el.value; save(); toast('Re-plan to apply'); }
});
state = load();
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pw') signIn(); });
if (initLive()) { if (!state) state = defaultState(); render(); }
else if (!state) { state = defaultState(); replan(); } else render();
</script>
</body></html>
