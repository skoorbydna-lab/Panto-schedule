<style>

<script>
// Panto rehearsal planner – data + scheduling engine (shared by page and tests)
const DEFAULT_CAST = [
  { role: 'Hickory', actor: 'Andy' },
  { role: 'Dickory', actor: 'Phil R' },
  { role: 'Patty Cake', actor: 'Ro' },
  { role: 'Jack', actor: 'Meri' },
  { role: 'Puss', actor: 'Mary' },
  { role: 'Fairy', actor: 'Debs' },
  { role: 'Queen', actor: 'Mel' },
  { role: 'Princess', actor: 'Beth' },
  { role: 'Olaf', actor: 'Pete A' },
  { role: 'Gunther', actor: 'Stu' },
  { role: 'Dipsy', actor: 'Niki' },
  { role: 'Royal Guard 1', actor: 'Phil B' },
  { role: 'Royal Guard 2', actor: 'Phil B' },
  { role: 'Ghost', actor: 'Ghost' }
];
const ALL_ROLES = DEFAULT_CAST.map(c => c.role);
const DEFAULT_SCENES = [
  { id: 'a1s1', name: 'Act 1 Prologue + Scene 1', place: 'Outside the mill', mins: 80, roles: ['Patty Cake','Dipsy','Hickory','Dickory','Jack','Puss','Fairy','Olaf','Gunther'] },
  { id: 'a1s2', name: 'Act 1 Scene 2', place: 'The palace', mins: 20, roles: ['Queen','Princess','Royal Guard 1','Puss'] },
  { id: 'a1s3', name: 'Act 1 Scene 3', place: 'The windmill', mins: 30, roles: ['Hickory','Dickory','Dipsy','Olaf','Gunther','Fairy'] },
  { id: 'a1s4', name: 'Act 1 Scene 4', place: 'The picnic', mins: 60, roles: ['Patty Cake','Jack','Puss','Hickory','Dickory','Dipsy','Queen','Princess','Royal Guard 1','Royal Guard 2'] },
  { id: 'a1s5', name: 'Act 1 Scene 5', place: 'The glade', mins: 25, roles: ['Jack','Princess','Hickory','Dickory','Olaf','Queen','Patty Cake'] },
  { id: 'a2s1', name: 'Act 2 Scene 1', place: 'The castle door', mins: 35, roles: ['Jack','Patty Cake','Hickory','Dickory','Queen','Dipsy','Ghost'] },
  { id: 'a2s2', name: 'Act 2 Scene 2', place: 'Front of tabs', mins: 15, roles: ['Hickory','Dickory','Olaf','Gunther'] },
  { id: 'a2s3', name: 'Act 2 Scene 3', place: 'Inside the castle', mins: 45, roles: ['Princess','Fairy','Olaf','Hickory','Dickory','Patty Cake','Queen','Jack','Puss','Dipsy'] },
  { id: 'a2s4', name: 'Act 2 Scene 4', place: 'Front of tabs', mins: 15, roles: ['Hickory','Dickory'] },
  { id: 'a2s5', name: 'Act 2 Scene 5 + Finale', place: 'Wedding & walkdown', mins: 30, roles: ALL_ROLES.filter(r => r !== 'Ghost') }
];
function mondays(startISO, endISO) {
  const out = []; let d = new Date(startISO + 'T12:00:00Z'); const end = new Date(endISO + 'T12:00:00Z');
  while (d < end) { out.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() + 7 * 864e5); }
  return out;
}
function defaultState() {
  const dates = mondays('2026-11-23', '2027-01-29');
  return {
    v: 1,
    settings: { sessionMins: 120, startTime: '19:30', minReps: 2, opening: '2027-01-29' },
    cast: DEFAULT_CAST.map(c => ({ ...c })),
    scenes: DEFAULT_SCENES.map(s => ({ ...s, roles: [...s.roles] })),
    nights: dates.map(date => ({
      date,
      type: (date === '2027-01-18' || date === '2027-01-25') ? 'run' : 'rehearsal',
      away: [], scenes: [], locked: false, note: ''
    }))
  };
}
function actorsFor(state, scene) {
  const map = Object.fromEntries(state.cast.map(c => [c.role, c.actor.trim()]));
  const set = new Set();
  scene.roles.forEach(r => { if (map[r]) set.add(map[r]); });
  return [...set];
}
function allActors(state) { return [...new Set(state.cast.map(c => c.actor.trim()).filter(Boolean))]; }

// Seeded RNG so a re-plan is repeatable
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// Plan: keeps locked nights, fills every other rehearsal night.
function plan(state, opts = {}) {
  const S = state.scenes, N = state.nights, cap = state.settings.sessionMins, R = state.settings.minReps;
  const sceneActors = S.map(s => actorsFor(state, s));
  const sceneIdx = Object.fromEntries(S.map((s, i) => [s.id, i]));
  const free = []; // night indexes the planner may fill
  N.forEach((n, i) => { if (n.type === 'rehearsal' && !n.locked) free.push(i); });
  // fixed (locked) occurrences
  const fixed = N.map((n, i) => (n.type === 'rehearsal' && n.locked) ? n.scenes.filter(id => id in sceneIdx).map(id => sceneIdx[id]) : []);
  const slots = [];
  S.forEach((s, si) => {
    const have = fixed.reduce((a, l) => a + l.filter(x => x === si).length, 0);
    for (let k = have; k < R; k++) slots.push(si);
  });
  if (!free.length || !slots.length) return { nights: N.map(n => n.scenes.slice()), cost: 0, issues: [] };
  const away = N.map(n => new Set(n.away));
  const W = { called: 3, missing: 60, over: 20, dup: 1000, gap: 15, early: 0.5, inv: 12, empty: 40, load: 0.04 };

  function cost(assign) {
    const per = N.map((_, i) => fixed[i].slice());
    assign.forEach((ni, k) => per[ni].push(slots[k]));
    let c = 0;
    const occ = S.map(() => []);
    per.forEach((list, ni) => {
      if (N[ni].type !== 'rehearsal') return;
      const seen = new Set(); let mins = 0; const called = new Set();
      list.forEach(si => {
        if (seen.has(si)) c += W.dup; seen.add(si);
        mins += S[si].mins; occ[si].push(ni);
        sceneActors[si].forEach(a => { called.add(a); if (away[ni].has(a)) c += W.missing; });
      });
      const capN = N[ni].mins || cap;
      if (mins > capN) c += W.over * (mins - capN);
      if (!list.length) c += W.empty;
      c += W.called * called.size + W.load * mins * mins / capN;
    });
    const first = occ.map(l => l.length ? Math.min(...l) : 99);
    for (let i = 0; i < first.length; i++) for (let j = i + 1; j < first.length; j++) if (first[j] < first[i]) c += W.inv;
    occ.forEach((list, si) => {
      list.sort((a, b) => a - b);
      if (list.length) c += W.early * list[0];
      for (let j = 1; j < list.length; j++) if (list[j] - list[j - 1] < 2) c += W.gap * (2 - (list[j] - list[j - 1]));
    });
    return c;
  }
  let best = null, bestC = Infinity;
  const restarts = opts.restarts || 6, iters = opts.iters || 25000;
  for (let r = 0; r < restarts; r++) {
    const rand = rng(1234 + r * 7919);
    let cur = slots.map(() => free[Math.floor(rand() * free.length)]);
    let cc = cost(cur);
    let T = 40;
    for (let it = 0; it < iters; it++) {
      const next = cur.slice();
      if (rand() < 0.7) next[Math.floor(rand() * next.length)] = free[Math.floor(rand() * free.length)];
      else { const a = Math.floor(rand() * next.length), b = Math.floor(rand() * next.length); [next[a], next[b]] = [next[b], next[a]]; }
      const nc = cost(next);
      if (nc <= cc || rand() < Math.exp((cc - nc) / T)) { cur = next; cc = nc; }
      T = Math.max(0.05, T * 0.9996);
      if (cc < bestC) { bestC = cc; best = cur.slice(); }
    }
  }
  const result = N.map((n, i) => (n.type === 'rehearsal' && n.locked) ? n.scenes.slice() : []);
  best.forEach((ni, k) => result[ni].push(S[slots[k]].id));
  result.forEach(list => list.sort((a, b) => sceneIdx[a] - sceneIdx[b]));
  return { nights: result, cost: bestC };
}
// ---------- app ----------
// ===== LIVE SETTINGS – paste your Firebase details here =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDv3JfyJWQ6BFJ03WQIK4OJ4OnQWNY5uNo",
  authDomain: "javelin-toss-fe81d.firebaseapp.com",
  projectId: "javelin-toss-fe81d",
  storageBucket: "javelin-toss-fe81d.firebasestorage.app",
  messagingSenderId: "310679295817",
  appId: "1:310679295817:web:65a93e4940e62a5ae5ac98"
};
const DIRECTOR_EMAIL = 'director@peaklandplayers.panto';  // made-up account; the director only types the password
// =============================================================
const KEY = 'pib-rehearsal-v2';
let me = '', onlyMine = false;
try { const m = JSON.parse(localStorage.getItem('pib-me') || '{}'); me = m.me || ''; onlyMine = !!m.only; } catch(e){}
function saveMe(){ try { localStorage.setItem('pib-me', JSON.stringify({ me, only: onlyMine })); } catch(e){} }
let live = false, canEdit = true, docRef = null, docExists = false;
let state, tab = 'schedule', openPanel = null;
function load(){ try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return null; }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if (live && canEdit) {
    clearTimeout(save.t);
    save.t = setTimeout(() => docRef.set({ data: JSON.stringify(state), updated: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => { docExists = true; }).catch(e => toast('Not saved – ' + (e.code || e.message))), 400);
  }
}
function initLive(){
  if (!FIREBASE_CONFIG || typeof firebase === 'undefined') return false;
  firebase.initializeApp(FIREBASE_CONFIG);
  docRef = firebase.firestore().collection('panto').doc('schedule');
  live = true; canEdit = false;
  firebase.auth().onAuthStateChanged(u => {
    canEdit = !!u;
    if (canEdit && !docExists) { state = state || defaultState(); replan(); } else render();
  });
  docRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    docExists = snap.exists;
    if (snap.exists) { try { state = JSON.parse(snap.data().data); localStorage.setItem(KEY, snap.data().data); } catch(e){} }
    if (!(canEdit && openPanel !== null)) render();
  }, () => toast('Offline – showing last saved copy'));
  return true;
}
async function signIn(){
  const pw = $('#pw').value, err = $('#pw-err');
  try { await firebase.auth().signInWithEmailAndPassword(DIRECTOR_EMAIL, pw); tab = 'schedule'; toast('Signed in – you can edit'); }
  catch(e){ err.style.display = 'block'; err.textContent = 'Wrong password, or no internet.'; }
}
const today = new Date().toISOString().slice(0,10);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (iso, long) => new Date(iso+'T12:00:00Z').toLocaleDateString('en-GB',{weekday: long?'long':'short', day:'numeric', month:'short', timeZone:'UTC'});
const sceneById = id => state.scenes.find(s => s.id === id);
function addMins(hhmm, m){ const [h,mm] = hhmm.split(':').map(Number); const t = h*60+mm+m; return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function toast(msg){ const d = document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 2200); }

function nightInfo(n){
  const everyone = allActors(state);
  if (n.type === 'cancelled') return { called: [], off: everyone, items: [], mins: 0, issues: [] };
  if (n.type === 'run') {
    const away = everyone.filter(a => n.away.includes(a));
    return { called: everyone, off: [], items: [], mins: n.mins || state.settings.sessionMins, issues: away.length ? [away.join(', ')+' away for the run'] : [], calls:{} };
  }
  const start = n.start || state.settings.startTime, cap = n.mins || state.settings.sessionMins;
  let t = start, mins = 0; const items = [], calls = {}, called = [], issues = [];
  n.scenes.forEach(id => {
    const s = sceneById(id); if(!s) return;
    const actors = actorsFor(state, s);
    items.push({ s, time: t, actors });
    actors.forEach(a => { if(!(a in calls)) { calls[a] = t; called.push(a); } });
    const missing = actors.filter(a => n.away.includes(a));
    if (missing.length) issues.push(missing.join(', ') + ' away but needed for ' + s.name);
    t = addMins(t, s.mins); mins += s.mins;
  });
  if (mins > cap) issues.push('Over time by ' + (mins - cap) + ' min');
  const off = everyone.filter(a => !called.includes(a));
  return { called, off, items, mins, issues, calls, end: t, start, cap };
}
function coverage(){
  const c = Object.fromEntries(state.scenes.map(s => [s.id, 0]));
  state.nights.forEach(n => { if(n.type==='rehearsal') n.scenes.forEach(id => { if(id in c) c[id]++; }); });
  return c;
}
function replan(){
  state.nights.forEach(n => { if (n.date < today && n.type === 'rehearsal') n.locked = true; });
  const r = plan(state);
  r.nights.forEach((list, i) => { if (state.nights[i].type === 'rehearsal') state.nights[i].scenes = list; else state.nights[i].scenes = []; });
  save(); render(); toast('Schedule re-planned');
}
function whatsapp(n){
  const info = nightInfo(n);
  let t = '🎭 *Puss in Boots – ' + fmtDate(n.date, true) + (n.extra ? ' (extra rehearsal)' : '') + '*\n';
  if (n.type === 'cancelled') return t + 'No rehearsal this week.';
  if (n.type === 'run') return t + 'FULL RUN – everyone called, ' + (n.start || state.settings.startTime) + '.' + (n.note ? '\n'+n.note : '');
  if (!info.items.length) return t + 'Nothing scheduled yet.';
  t += '\n';
  info.items.forEach(it => { t += it.time + '  ' + it.s.name + ' (' + it.s.place + ')\n'; });
  t += 'Finish approx ' + info.end + '\n\n*Called:*\n';
  info.called.forEach(a => { t += '• ' + a + ' – ' + info.calls[a] + '\n'; });
  if (info.off.length) t += '\n*Night off:* ' + info.off.join(', ');
  if (n.note) t += '\n\n' + n.note;
  return t;
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('Copied – paste into WhatsApp'); }
  catch(e){ showModal(text); }
}
function showModal(text){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = '<div class="box"><p class="note">Press and hold in the box, choose <b>Select All</b>, then <b>Copy</b>.</p><textarea>'+esc(text)+'</textarea><div class="bar" style="margin-top:8px"><button class="btn" id="m-sel">Select all</button><button class="btn primary" id="m-done">Done</button></div></div>';
  const ta = m.querySelector('textarea');
  m.querySelector('#m-sel').onclick = () => { ta.focus(); ta.setSelectionRange(0, ta.value.length); try{ document.execCommand('copy') && toast('Copied'); }catch(e){} };
  m.querySelector('#m-done').onclick = () => m.remove(); m.onclick = e => { if(e.target===m) m.remove(); };
  document.body.appendChild(m);
}
function renderSchedule(){
  const cov = coverage(), R = state.settings.minReps;
  let h = canEdit ? '<div class="bar"><button class="btn primary" id="replan">⟳ Re-plan schedule</button><span class="note" style="font-size:12px;color:var(--muted)">Keeps 📌 pinned nights; refills the rest.</span></div>' : '';
  if (canEdit) h += '<div class="card"><div class="cb" style="padding-top:10px"><b>Add an extra rehearsal</b><div class="bar" style="margin:8px 0 0"><input type="date" id="x-date"><input type="time" id="x-start" value="'+state.settings.startTime+'"><button class="btn small primary" id="x-add">Add</button></div></div></div>';
  if (live && !docExists) h += '<p class="note">The schedule hasn\'t been published yet.</p>';
  const people = allActors(state); if (me && !people.includes(me)) me = '';
  h += '<div class="card mebar"><div class="cb" style="padding-top:10px"><div class="bar" style="margin:0"><b>Me:</b><select id="me-sel"><option value="">Everyone</option>' + people.map(a => '<option'+(a===me?' selected':'')+'>'+esc(a)+'</option>').join('') + '</select>' + (me ? '<label style="display:flex;align-items:center;gap:6px;font-weight:600"><input type="checkbox" id="me-only"'+(onlyMine?' checked':'')+' style="width:20px;height:20px"> Only show when I\'m needed</label>' : '') + '</div>';
  if (me) { const mine = state.nights.filter(n => n.type !== 'cancelled' && nightInfo(n).called.includes(me) && !n.away.includes(me)); h += '<p class="note" style="margin:8px 0 0">'+esc(me)+' is needed on <b>'+mine.length+'</b> of '+state.nights.filter(n=>n.type!=='cancelled').length+' nights.</p>'; }
  h += '</div></div>';
  if (!(me && onlyMine)) h += '<div class="cov">' + state.scenes.map(s => '<span class="'+(cov[s.id] < R ? 'low':'')+'">'+esc(s.name.replace('Act ','A').replace(' Scene ',' Sc ').replace('Prologue + ',''))+' ×'+cov[s.id]+'</span>').join('') + '</div>';
  let shown = 0;
  state.nights.forEach((n, i) => {
    const info = nightInfo(n), past = n.date < today;
    const needed = me && info.called.includes(me);
    if (me && onlyMine && (!needed || n.type === 'cancelled')) return;
    shown++;
    const tagCls = n.type==='run' ? 'run' : n.type==='cancelled' ? 'off' : '';
    const tagTxt = n.type==='run' ? 'Full run' : n.type==='cancelled' ? 'Cancelled' : n.extra ? 'Extra' : 'Rehearsal';
    const weeksTo = Math.round((new Date(state.settings.opening) - new Date(n.date))/(7*864e5));
    h += '<div class="card'+(past?' past':'')+'"><div class="ch"><div><div class="date">'+fmtDate(n.date)+'</div><div class="wk">'+weeksTo+' wk'+(weeksTo===1?'':'s')+' to opening</div></div>';
    h += '<span class="tag '+tagCls+'">'+tagTxt+'</span>';
    if (n.type==='rehearsal' && canEdit) h += '<button class="lock'+(n.locked?' on':'')+'" data-lock="'+i+'" title="Pin this night so re-planning leaves it alone">📌</button>';
    h += '</div><div class="cb">';
    if (me && n.type !== 'cancelled') h += needed ? '<div class="mine">⭐ '+esc(me)+(n.away.includes(me) ? ' – marked away' : ' – arrive '+(n.type==='run' ? (n.start||state.settings.startTime) : info.calls[me]))+'</div>' : '<div class="mine off">'+esc(me)+' – night off</div>';
    if (n.type==='rehearsal') {
      if (!info.items.length) h += '<p class="note">No scenes yet.</p>';
      info.items.forEach((it, k) => {
        h += '<div class="sc'+(me && it.actors.includes(me) ? ' me' : (me ? ' notme' : ''))+'"><span class="t">'+it.time+'</span><span class="n"><b>'+esc(it.s.name)+'</b><small>'+esc(it.s.place)+' · '+it.s.mins+' min · '+esc(it.actors.join(', '))+'</small></span>'+(canEdit?'<button class="x" data-rm="'+i+':'+k+'" title="Remove">×</button>':'')+'</div>';
      });
      const pct = Math.min(100, info.mins / info.cap * 100);
      h += '<div class="meter'+(info.mins>info.cap?' over':'')+'"><i style="width:'+pct+'%"></i></div><div class="meta"><span>'+info.mins+' of '+info.cap+' min</span><span>'+(info.items.length? 'finish ≈ '+info.end : '')+'</span></div>';
    }
    if (n.type!=='cancelled') {
      h += '<div class="ppl"><b>Called ('+info.called.length+'):</b> '+(info.called.map(a => esc(a) + (info.calls && info.calls[a] && info.calls[a]!==info.start ? ' <span style="color:var(--muted)">'+info.calls[a]+'</span>' : '')).join(', ') || '—')+'</div>';
      if (info.off.length) h += '<div class="ppl"><b class="off">Night off:</b> '+esc(info.off.join(', '))+'</div>';
    }
    if (n.away.length) h += '<div class="ppl"><b style="color:var(--bad)">Away:</b> '+esc(n.away.join(', '))+'</div>';
    if (n.note) h += '<div class="ppl"><b>Note:</b> '+esc(n.note)+'</div>';
    info.issues.forEach(x => h += '<div class="warn">⚠ '+esc(x)+'</div>');
    h += '</div>';
    if (openPanel === i) {
      h += '<div class="panel"><label class="f">Night type</label><select data-type="'+i+'"><option value="rehearsal"'+(n.type==='rehearsal'?' selected':'')+'>Rehearsal</option><option value="run"'+(n.type==='run'?' selected':'')+'>Full run</option><option value="cancelled"'+(n.type==='cancelled'?' selected':'')+'>Cancelled</option></select>';
      h += '<label class="f">Who can\'t make it? (tap to mark away)</label><div class="chips">' + allActors(state).map(a => '<button data-away="'+i+'" data-a="'+esc(a)+'" class="'+(n.away.includes(a)?'away':'')+'">'+esc(a)+'</button>').join('') + '</div>';
      if (n.type==='rehearsal') {
        h += '<label class="f">Add a scene</label><select data-add="'+i+'"><option value="">Choose…</option>' + state.scenes.filter(s => !n.scenes.includes(s.id)).map(s => '<option value="'+s.id+'">'+esc(s.name)+' ('+s.mins+' min)</option>').join('') + '</select>';
      }
      h += '<label class="f">Start time and length (minutes)</label><div class="bar"><input type="time" data-start="'+i+'" value="'+(n.start||state.settings.startTime)+'"><input type="number" min="30" step="15" data-len="'+i+'" value="'+(n.mins||state.settings.sessionMins)+'" style="width:80px"></div>';
      h += '<label class="f">Note for the cast</label><input data-note="'+i+'" value="'+esc(n.note)+'" placeholder="e.g. bring scripts, Dipsy costume fitting" style="width:100%">';
      if (n.extra) h += '<div class="bar" style="margin-top:10px"><button class="btn small" style="color:var(--bad)" data-del="'+i+'">Remove this date</button></div>';
      h += '</div>';
    }
    h += '<div class="foot">'+(canEdit?'<button class="btn small" data-edit="'+i+'">'+(openPanel===i?'Done':'Edit / who\'s away')+'</button>':'')+'<a class="btn small wa" href="https://api.whatsapp.com/send?text='+encodeURIComponent(whatsapp(n))+'" target="_blank" rel="noopener">Send to WhatsApp</a><button class="btn small" data-wa="'+i+'">Copy text</button></div></div>';
  });
  if (me && onlyMine && !shown) h += '<p class="note">No rehearsals for '+esc(me)+' yet.</p>';
  return h;
}
function renderPeople(){
  const people = allActors(state);
  const nights = state.nights.filter(n => n.type !== 'cancelled');
  const infos = nights.map(nightInfo);
  let h = '<h2>Who\'s called when</h2><p class="note">● called · ○ night off · ✕ away</p><div class="card grid"><table><tr><th>Name</th>' + nights.map(n => '<th>'+fmtDate(n.date).replace(/^\w+ /,'')+'</th>').join('') + '<th>Off</th></tr>';
  people.forEach(p => {
    let off = 0;
    h += '<tr><td><b>'+esc(p)+'</b><br><small style="color:var(--muted)">'+esc(state.cast.filter(c => c.actor.trim()===p).map(c => c.role).join(', '))+'</small></td>';
    nights.forEach((n, k) => {
      const called = infos[k].called.includes(p), away = n.away.includes(p);
      if (!called) off++;
      h += '<td class="c '+(away?'a':called?'y':'o')+'">'+(away?'✕':called?'●':'○')+'</td>';
    });
    h += '<td class="c">'+off+'</td></tr>';
  });
  h += '</table></div>';
  const unc = state.cast.filter(c => !c.actor.trim());
  if (unc.length) h += '<p class="note">Not yet cast: '+esc(unc.map(c=>c.role).join(', '))+' (add them in Setup).</p>';
  return h;
}
function renderScenes(){
  const cov = coverage();
  let h = '<h2>Scenes</h2><p class="note">Rehearsal minutes are estimates from the script length – adjust them and re-plan.</p>';
  state.scenes.forEach((s, i) => {
    const when = state.nights.filter(n => n.type==='rehearsal' && n.scenes.includes(s.id)).map(n => fmtDate(n.date));
    h += '<div class="card"><div class="cb" style="padding-top:12px"><div style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>'+esc(s.name)+'</b><div class="wk">'+esc(s.place)+'</div></div><input type="number" min="5" step="5" value="'+s.mins+'" data-mins="'+i+'" style="width:70px"'+(canEdit?'':' disabled')+'> <span class="wk">min</span></div>';
    h += '<div class="ppl">'+s.roles.map(r => { const a = (state.cast.find(c=>c.role===r)||{}).actor; return esc(r)+' <span style="color:var(--muted)">('+esc(a && a.trim() ? a : '?')+')</span>'; }).join(', ')+'</div>';
    h += '<div class="ppl"><b>Rehearsed '+cov[s.id]+'×:</b> '+(when.join(', ')||'not yet')+'</div></div></div>';
  });
  return h;
}
function renderSetup(){
  const st = state.settings;
  if (live && !canEdit) return '<h2>Director sign-in</h2><div class="card"><div class="cb" style="padding-top:10px"><p class="note">Everyone can view the schedule. Only the director can change it.</p><label class="f">Password</label><input type="password" id="pw" style="width:100%" autocomplete="current-password"><div class="bar" style="margin-top:10px"><button class="btn primary" id="pw-go">Sign in</button></div><div class="warn" id="pw-err" style="display:none"></div></div></div>';
  let top = live ? '<div class="card"><div class="cb" style="padding-top:10px;display:flex;align-items:center;gap:8px"><span style="flex:1">✅ Signed in as director – changes go live for everyone.</span><button class="btn small" id="pw-out">Sign out</button></div></div>' : '';
  let h = top + '<h2>Session</h2><div class="card"><div class="cb" style="padding-top:6px">';
  h += '<label class="f">Start time</label><input type="time" id="s-start" value="'+st.startTime+'">';
  h += '<label class="f">Session length (minutes)</label><input type="number" id="s-len" min="30" step="15" value="'+st.sessionMins+'">';
  h += '<label class="f">Rehearse each scene at least</label><select id="s-reps">'+[1,2,3].map(x=>'<option'+(x===st.minReps?' selected':'')+'>'+x+'</option>').join('')+'</select> times';
  h += '<label class="f">Add an extra rehearsal date</label><input type="date" id="s-date"> <button class="btn small" id="s-adddate">Add</button>';
  h += '</div></div><h2>Cast</h2><div class="card"><div class="cb" style="padding-top:6px"><table>';
  state.cast.forEach((c, i) => { h += '<tr><td>'+esc(c.role)+'</td><td><input data-cast="'+i+'" value="'+esc(c.actor)+'" placeholder="?" style="width:100%"></td></tr>'; });
  h += '</table><p class="note">Give two roles the same name if one person doubles.</p></div></div>';
  h += '<h2>Backup</h2><div class="card"><div class="cb" style="padding-top:10px"><p class="note">The schedule is saved in this browser only. Copy a backup now and then (e.g. into a WhatsApp chat to yourself) – paste it back to restore or move to another phone.</p><div class="bar"><button class="btn" id="b-copy">Copy backup</button><button class="btn" id="b-paste">Restore from backup</button><button class="btn ghost" id="b-reset" style="color:var(--bad)">Reset everything</button></div></div></div>';
  return h;
}
function render(){
  $('#count').textContent = 'Opening night: ' + fmtDate(state.settings.opening, true) + ' · ' + Math.max(0, Math.ceil((new Date(state.settings.opening) - new Date(today))/864e5)) + ' days to go';
  const setupBtn = document.querySelector('nav button[data-t="setup"]'); if (setupBtn) setupBtn.textContent = (live && !canEdit) ? 'Director' : 'Setup';
  if (live) $('#count').textContent += canEdit ? ' · ✏️ Editing' : ' · 🔴 Live';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#main').innerHTML = tab==='schedule' ? renderSchedule() : tab==='people' ? renderPeople() : tab==='scenes' ? renderScenes() : renderSetup();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.t) { tab = d.t; render(); return; }
  if (b.id === 'pw-go') return signIn();
  if (b.id === 'pw-out') { firebase.auth().signOut(); openPanel = null; return; }
  if (!canEdit && !d.wa) return;
  if (b.id === 'replan') return replan();
  if (d.lock) { const n = state.nights[+d.lock]; n.locked = !n.locked; save(); render(); return; }
  if (d.edit) { openPanel = openPanel === +d.edit ? null : +d.edit; render(); return; }
  if (d.wa) return copyText(whatsapp(state.nights[+d.wa]));
  if (d.rm) { const [i,k] = d.rm.split(':').map(Number); state.nights[i].scenes.splice(k,1); state.nights[i].locked = true; save(); render(); return; }
  if (d.away) { const n = state.nights[+d.away]; const a = d.a; n.away = n.away.includes(a) ? n.away.filter(x => x!==a) : [...n.away, a]; save(); render(); return; }
  if (b.id === 'x-add') { const v = $('#x-date').value, st = $('#x-start').value; if (!v) return toast('Pick a date first'); if (state.nights.some(n=>n.date===v)) return toast('That date is already in the schedule'); state.nights.push({date:v,type:'rehearsal',away:[],scenes:[],locked:false,note:'',extra:true,start:st&&st!==state.settings.startTime?st:undefined}); state.nights.sort((a,b)=>a.date<b.date?-1:1); openPanel=null; replan(); toast('Extra rehearsal added and schedule re-planned'); return; }
  if (d.del) { const n = state.nights[+d.del]; state.nights.splice(+d.del,1); openPanel=null; replan(); toast(fmtDate(n.date)+' removed'); return; }
  if (b.id === 's-adddate') { const v = $('#s-date').value; if (v && !state.nights.some(n=>n.date===v)) { state.nights.push({date:v,type:'rehearsal',away:[],scenes:[],locked:false,note:'',extra:true}); state.nights.sort((a,b)=>a.date<b.date?-1:1); save(); toast('Date added – re-plan to use it'); render(); } return; }
  if (b.id === 'b-copy') return copyText(JSON.stringify(state));
  if (b.id === 'b-paste') {
    const m = document.createElement('div'); m.className='modal';
    m.innerHTML = '<div class="box"><p class="note">Paste your backup text:</p><textarea></textarea><div class="bar" style="margin-top:8px"><button class="btn primary" id="r-ok">Restore</button><button class="btn" id="r-no">Cancel</button></div><div id="r-err" class="warn" style="display:none"></div></div>';
    document.body.appendChild(m);
    m.querySelector('#r-no').onclick = () => m.remove();
    m.querySelector('#r-ok').onclick = () => { try { const s = JSON.parse(m.querySelector('textarea').value); if(!s.nights||!s.scenes) throw 0; state = s; save(); m.remove(); render(); toast('Restored'); } catch(err){ const x = m.querySelector('#r-err'); x.style.display='block'; x.textContent='That doesn\'t look like a backup.'; } };
    return;
  }
  if (b.id === 'b-reset') {
    const m = document.createElement('div'); m.className='modal';
    m.innerHTML = '<div class="box"><p>Reset all dates, absences and edits back to the start?</p><div class="bar"><button class="btn" style="background:var(--bad);color:#fff;border-color:var(--bad)" id="x-ok">Reset</button><button class="btn" id="x-no">Cancel</button></div></div>';
    document.body.appendChild(m);
    m.querySelector('#x-no').onclick = () => m.remove();
    m.querySelector('#x-ok').onclick = () => { m.remove(); state = defaultState(); replan(); };
  }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (el.id === 'me-sel') { me = el.value; if (!me) onlyMine = false; saveMe(); render(); return; }
  if (el.id === 'me-only') { onlyMine = el.checked; saveMe(); render(); return; }
  if (!canEdit) return;
  if (d.type) { const n = state.nights[+d.type]; n.type = el.value; if (n.type!=='rehearsal') n.scenes = []; save(); render(); toast('Re-plan to rebalance the other nights'); }
  else if (d.add) { if (el.value) { const n = state.nights[+d.add]; n.scenes.push(el.value); const order = state.scenes.map(s=>s.id); n.scenes.sort((a,b)=>order.indexOf(a)-order.indexOf(b)); n.locked = true; save(); render(); } }
  else if (d.start) { state.nights[+d.start].start = el.value || undefined; save(); render(); }
  else if (d.len) { state.nights[+d.len].mins = Math.max(30, +el.value||120); save(); render(); toast('Re-plan to use the new length'); }
  else if (d.note !== undefined) { state.nights[+d.note].note = el.value; save(); render(); }
  else if (d.mins) { state.scenes[+d.mins].mins = Math.max(5, +el.value||5); save(); render(); }
  else if (d.cast) { state.cast[+d.cast].actor = el.value; save(); }
  else if (el.id === 's-start') { state.settings.startTime = el.value || '19:30'; save(); }
  else if (el.id === 's-len') { state.settings.sessionMins = Math.max(30, +el.value||120); save(); }
  else if (el.id === 's-reps') { state.settings.minReps = +el.value; save(); toast('Re-plan to apply'); }
});
state = load();
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pw') signIn(); });
if (initLive()) { if (!state) state = defaultState(); render(); }
else if (!state) { state = defaultState(); replan(); } else render();
</script>
</body></html>
